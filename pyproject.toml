[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-document-ai"
version = "0.1.0"
description = "Open-source toolkit for extracting and structuring financial information from business documents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nathan Lorent"}]
dependencies = ["pypdf>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
financial-document-ai = "financial_document_ai.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
